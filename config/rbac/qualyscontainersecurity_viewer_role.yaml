# This rule is not used by the project qualys-nanny itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to qualys.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: qualys-nanny
    app.kubernetes.io/managed-by: kustomize
  name: qualyscontainersecurity-viewer-role
rules:
- apiGroups:
  - qualys.io
  resources:
  - qualyscontainersecurities
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - qualys.io
  resources:
  - qualyscontainersecurities/status
  verbs:
  - get
