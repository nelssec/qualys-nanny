apiVersion: qualys.qualys.io/v1alpha1
kind: QualysCloudAgent
metadata:
  labels:
    app.kubernetes.io/name: qualys-nanny
    app.kubernetes.io/managed-by: kustomize
  name: qualys-cloud-agent
  namespace: qualys
spec:
  platformConfigRef:
    name: qualys-platform
  deploymentMode: auto
  config:
    logLevel: 3
    cmdMaxTimeOut: 1800
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  scheduling:
    nodeSelector:
      kubernetes.io/os: linux
    tolerations:
      - operator: Exists
        effect: NoSchedule
      - operator: Exists
        effect: NoExecute
    priorityClassName: system-node-critical
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: "25%"
