apiVersion: qualys.qualys.io/v1alpha1
kind: QualysContainerSecurity
metadata:
  labels:
    app.kubernetes.io/name: qualys-nanny
    app.kubernetes.io/managed-by: kustomize
  name: qualys-container-security
  namespace: qualys
spec:
  platformConfigRef:
    name: qualys-platform
  containerSensor:
    enabled: true
    image:
      repository: qualys/qcs-sensor
      tag: "latest"
      pullPolicy: IfNotPresent
    mode: general
    k8sMode: true
    scanning:
      enableImageScan: true
      enableContainerScan: true
      scanThreadPoolSize: 2
    storage:
      usePersistentStorage: true
      storageSize: "10Gi"
    logging:
      logLevel: 3
  clusterSensor:
    enabled: true
    replicas: 1
  admissionController:
    enabled: false
    replicas: 2
    failurePolicy: Ignore
  runtimeSensor:
    enabled: false
  containerRuntime:
    type: auto
  scheduling:
    nodeSelector:
      kubernetes.io/os: linux
    tolerations:
      - operator: Exists
        effect: NoSchedule
      - operator: Exists
        effect: NoExecute
    priorityClassName: system-node-critical
